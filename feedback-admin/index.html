<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Feedback Admin</title><style>body{font:14px/1.6 system-ui,"PingFang SC";background:#faf7f5;color:#29262c;margin:0}.wrap{max-width:900px;margin:40px auto;padding:20px}.box,.record{background:#fff;border:1px solid #eadfe2;border-radius:18px;padding:18px;margin:12px 0}input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #ddd}button{background:#29262c;color:#fff;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#faf7f5;padding:12px;border-radius:12px}.muted{color:#817980}</style></head><body><main class="wrap"><h1>Feedback Admin</h1><div class="box"><p class="muted">输入 EdgeOne 环境变量 FEEDBACK_ADMIN_TOKEN 对应的管理员口令。口令只用于本次请求，不会保存在页面。</p><input id="token" type="password" placeholder="管理员口令"><button id="load">读取反馈</button><span id="state"></span></div><div id="records"></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));document.getElementById('load').onclick=async()=>{const t=document.getElementById('token').value;const st=document.getElementById('state');st.textContent=' 读取中…';try{const r=await fetch('/api/feedback-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});const d=await r.json();if(!r.ok)throw 0;st.textContent=` 共 ${d.count} 份`;document.getElementById('records').innerHTML=d.records.map((x,i)=>`<article class="record"><b>反馈 ${i+1}</b><div class="muted">首次：${esc(x.created_at)}<br>更新：${esc(x.updated_at)}<br>ID：${esc(x.submission_id)}</div><pre>${esc(JSON.stringify(x.answers,null,2))}</pre></article>`).join('')}catch(e){st.textContent=' 读取失败 / 口令不正确'}};</script></body></html>
