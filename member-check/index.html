</style></head><body><main class="wrap">
<div class="eyebrow">FAJIA · INTERNAL TOOL</div>
<h1>豆瓣成员管理</h1>
<p class="lead">查询成员状态与历史发言，并复核新组待剔除成员。</p>

<section class="panel">
  <label for="token">内部访问口令</label>
  <input
    id="token"
    type="password"
    autocomplete="off"
    placeholder="MEMBER_CHECK_TOKEN"
  >
  <div class="hint">仅随本次请求发送，不会保存在页面中。</div>
</section>

<nav class="tabs" aria-label="成员管理功能">
  <button
    id="tabSearch"
    class="tab active"
    type="button"

  <button
    id="tabReview"
    class="tab"
    type="button"
  >待剔除复核</button>
</nav>

<section id="searchView" class="view">
  <section class="panel">
    <label for="query">账号</label>
    <input
      id="query"
      type="search"
      autocomplete="off"
      placeholder="昵称 / 数字 UID / profile key / 豆瓣个人主页 URL"
    >
    <div class="hint">
      昵称可能重名；UID、profile key 或个人主页最可靠。
    </div>

    <div class="actions">
      <button id="search" type="button">搜索</button>
      <span class="state" id="state"></span>
    </div>
  </section>

  <section id="summary"></section>
  <section id="results"></section>
</section>

<section
  id="reviewView"
  class="view"
  hidden
>
  <section class="panel">
    <div class="review-head">
      <div>
        <div class="review-title">新组待剔除复核</div>
        <div class="hint">
          仅用于人工复核，不会自动移除任何成员。
        </div>
      </div>

      <button
        id="refreshReview"
        type="button"
      >刷新名单</button>
    </div>

    <div
      class="state"
      id="reviewState"
      style="margin:12px 0 0"
    ></div>
  </section>

  <section id="reviewSummary"></section>
  <section id="reviewRules"></section>
  <section id="reviewFilters"></section>
  <section id="reviewResults"></section>
</section>

</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let trackedGroups=[];function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch{return String(v)}}function meta(s){if(!s)return{c:'never',l:'成员快照中无记录',i:'—'};if(s.status==='CURRENT')return{c:'current',l:Number(s.rejoined_count||0)>0?`当前成员 · 曾重新加入 ${Number(s.rejoined_count)} 次`:'当前成员',i:'✓'};if(s.status==='MISSING')return{c:'missing',l:'待确认是否退出',i:'?'};if(s.status==='EXITED')return{c:'exited',l:'已退出',i:'○'};return{c:'never',l:'状态未知',i:'—'}}function hist(s,ho){if(!s)return`<div class="history"><div>${ho?'成员快照中未发现该组记录，无法据此判断首次快照之前的成员状态。':'当前成员数据库中没有该组成员记录。'}</div></div>`;const a=[];if(s.first_seen_at)a.push(`<div>首次发现：${esc(fmt(s.first_seen_at))}</div>`);if(s.last_seen_at)a.push(`<div>最后确认在组：${esc(fmt(s.last_seen_at))}</div>`);if(s.missing_since)a.push(`<div>首次检测缺失：${esc(fmt(s.missing_since))}</div>`);if(s.exit_confirmed_at)a.push(`<div>确认退出：${esc(fmt(s.exit_confirmed_at))}</div>`);if(Number(s.rejoined_count||0)>0)a.push(`<div>重新加入记录：${Number(s.rejoined_count)} 次</div>`);return`<div class="history">${a.join('')||'<div>已有成员记录，时间信息尚未提供。</div>'}</div>`}function card(g,m){const s=m.memberships?.[String(g.id)]||null,x=meta(s);return`<div class="group-card"><div class="group-top"><div class="group-name">${esc(g.name)}</div><span class="badge ${x.c}">${x.i} ${esc(x.l)}</span></div>${hist(s,m.historical_identity_only)}</div>`}function activityUrl(x){const direct=String(x?.source_url||'').trim(),m=String(x?.item_id||'').match(/^DB_(\d+)_(\d+)$/);if(!m)return direct;const topic=m[1],cid=m[2],start=Number(x?.page_start);if(Number.isInteger(start)&&start>=0)return`https://www.douban.com/group/topic/${topic}/?start=${start}#${cid}`;if(/^https:\/\/www\.douban\.com\/group\/topic\/\d+\//i.test(direct)){try{const u=new URL(direct);u.hash=cid;if(u.searchParams.has('start'))u.searchParams.delete('cid');else u.searchParams.set('cid',cid);return u.toString()}catch(_){}}return`https://www.douban.com/group/topic/${topic}/?cid=${cid}#${cid}`}function activityItem(x){const kind=x.source_type==='reply'?'回复':'发言',src=x.source_label||x.source_key||'豆瓣历史帖子',href=activityUrl(x),badge=href?`<a class="activity-source" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="打开豆瓣原发言">${esc(src)} · ${esc(kind)} ↗</a>`:`<div class="activity-source">${esc(src)} · ${esc(kind)}</div>`;return`<div class="activity-item"><div class="activity-row"><div class="activity-time">${esc(fmt(x.published_at))}</div>${badge}</div><div class="activity-text">${esc(x.text||'')}</div></div>`}function activityHasRows(a){
  return !!a&&(
    Number(a.total_count||0)>0||
    (
      Array.isArray(a.recent)&&
      a.recent.length>0
    )
  )
}

function activityBlockOne(
  m,
  gid,
  a,
  opts={}
){
  const items=
    Array.isArray(a?.recent)
      ? a.recent
      : [];

  const first=items.slice(0,5);
  const rest=items.slice(5);

  const base=String(
    m.author_uid||
    m.profile_key||
    ''
  ).replace(
    /[^a-zA-Z0-9_-]/g,
    '_'
  );

  const blockKey=String(
    opts.key||gid
  ).replace(
    /[^a-zA-Z0-9_-]/g,
    '_'
  );

  const id=
    `act_${base}_${blockKey}`;

  const g=trackedGroups.find(
    x=>String(x.id)===String(gid)
  );

  const name=
    opts.name||
    a?.group_name||
    g?.name||
    gid;

  const suffix=
    opts.suffix||
    '最近发言';

  return `
    <div class="activity">
      <div>
        <div class="activity-title">
          ${esc(name)} · ${esc(suffix)}
        </div>

        <div class="activity-meta">
          全历史已收录 ${Number(a?.total_count||0)} 条
          ${
            a?.latest_at
              ? ` · 最近一条 ${esc(fmt(a.latest_at))}`
              : ''
          }
        </div>
      </div>

      <div class="activity-list">
        ${first.map(activityItem).join('')}

        <div
          id="${id}"
          style="display:none"
        >
          ${rest.map(activityItem).join('')}
        </div>
      </div>

      ${
        rest.length
          ? `
            <button
              class="more"
              type="button"
              data-target="${id}"
              data-count="${rest.length}"
            >
              查看更多（再显示 ${rest.length} 条）
            </button>
          `
          : ''
      }
    </div>
  `;
}

function activityBlock(m){
  let acts=
    m?.activities&&
    typeof m.activities==='object'&&
    !Array.isArray(m.activities)
      ? m.activities
      : {};

  if(
    !Object.keys(acts).length&&
    m?.activity
  ){
    const gid=String(
      m.activity.group_id||
      '761299'
    );

    acts={
      [gid]:m.activity
    };
  }

  const order=new Map(
    trackedGroups.map(
      (g,i)=>[
        String(g.id),
        i
      ]
    )
  );

  const entries=
    Object.entries(acts)
      .filter(([,a])=>{
        if(!a)
          return false;

        if(activityHasRows(a))
          return true;

        const supplemental=
          a.supplemental&&
          typeof a.supplemental==='object'&&
          !Array.isArray(a.supplemental)
            ? a.supplemental
            : {};

        return Object.values(
          supplemental
        ).some(
          activityHasRows
        );
      })
      .sort(
        (a,b)=>
          (order.get(String(a[0]))??999)
          -
          (order.get(String(b[0]))??999)
      );

  if(!entries.length){
    return `
      <div class="activity">
        <div class="noactivity">
          当前已收录历史发言中没有匹配到该账号的发言。
        </div>
      </div>
    `;
  }

  const blocks=[];

  for(const [gid,a] of entries){

    /*
     * 761299:
     * main chat + two independently quota'd
     * supplemental towers.
     */
    if(String(gid)==='761299'){

      if(activityHasRows(a)){
        blocks.push(
          activityBlockOne(
            m,
            gid,
            a,
            {
              key:'761299_main',
              suffix:'闲聊楼 · 最近发言'
            }
          )
        );
      }

      const supplemental=
        a?.supplemental&&
        typeof a.supplemental==='object'&&
        !Array.isArray(a.supplemental)
          ? a.supplemental
          : {};

      for(
        const topic of [
          '502292130',
          '502372097'
        ]
      ){
        const section=
          supplemental[topic];

        if(
          !activityHasRows(section)
        ){
          continue;
        }

        blocks.push(
          activityBlockOne(
            m,
            gid,
            section,
            {
              key:
                `761299_${topic}`,

              name:
                section.source_label||
                `补充楼 ${topic}`,

              suffix:
                '最近发言'
            }
          )
        );
      }

      continue;
    }


    /*
     * Other groups retain their previous
     * one-group / one-block behaviour.
     */
    if(activityHasRows(a)){
      blocks.push(
        activityBlockOne(
          m,
          gid,
          a
        )
      );
    }
  }


  if(!blocks.length){
    return `
      <div class="activity">
        <div class="noactivity">
          当前已收录历史发言中没有匹配到该账号的发言。
        </div>
      </div>
    `;
  }

  return blocks.join('');
}

function render(m){const link=m.profile_url?`<a href="${esc(m.profile_url)}" target="_blank" rel="noopener noreferrer">打开豆瓣主页 ↗</a>`:'',uid=m.author_uid?`<div class="key">豆瓣 UID: ${esc(m.author_uid)}</div>`:'',pk=m.profile_key?`<div class="key">profile_key: ${esc(m.profile_key)}</div>`:'',note=m.historical_identity_only?`<div class="history-only"><strong>仅发现历史发言身份。</strong> 当前成员快照中没有该账号的成员记录，因此不能据此判断其当前状态，也不能直接认定为“已退出”。可能在首次成员快照之前已经退出，也可能从未被现有成员快照记录。</div>`:'';return`<article class="result"><div class="result-head"><div><div class="name">${esc(m.display_name||'未记录昵称')}</div>${pk}${uid}</div><div>${link}</div></div>${note}<div class="group-grid">${trackedGroups.map(g=>card(g,m)).join('')}</div>${activityBlock(m)}</article>`}async function run(){const token=$('token').value,query=$('query').value.trim(),st=$('state'),res=$('results'),sum=$('summary');res.innerHTML='';sum.innerHTML='';if(!token){st.textContent='请先输入内部访问口令';return}if(!query){st.textContent='请输入昵称、UID 或主页 URL';return}$('search').disabled=true;st.textContent='查询中…';try{const r=await fetch('/api/member-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,query})}),d=await r.json();if(r.status===401)throw new Error('口令不正确');if(!r.ok)throw new Error(d.error||'查询失败');trackedGroups=Array.isArray(d.tracked_groups)?d.tracked_groups:[];st.textContent=`成员索引：${fmt(d.generated_at)}${d.activity_generated_at?` · 发言索引：${fmt(d.activity_generated_at)}`:''}`;if(!d.matches?.length){res.innerHTML='<div class="panel empty">成员快照与已收录历史发言中都没有找到匹配账号。</div>';return}if(d.total_matches>1)sum.innerHTML=`<div class="warning">找到 ${d.total_matches} 个候选。昵称可能重名，请结合 UID / profile key / 个人主页确认身份。</div>`;res.innerHTML=d.matches.map(render).join('');document.querySelectorAll('.more').forEach(btn=>btn.addEventListener('click',()=>{const el=document.getElementById(btn.dataset.target);if(!el)return;const open=el.style.display!=='none';el.style.display=open?'none':'contents';btn.textContent=open?`查看更多（再显示 ${btn.dataset.count} 条）`:'收起更多发言'}))}catch(e){st.textContent=e.message||'查询失败'}finally{$('search').disabled=false}}
let currentReview=null;
let currentReviewFilter='all';

function setTab(name){
  const search=name==='search';

  $('searchView').hidden=!search;
  $('reviewView').hidden=search;

  $('tabSearch').classList.toggle(
    'active',
    search
  );

  $('tabReview').classList.toggle(
    'active',
    !search
  );

  if(!search){
    loadReview();
  }
}

function gateMeta(gate){
  const status=String(
    gate?.status||'UNKNOWN'
  );

  if(gate?.ready){
    return {
      cls:'gate-ready',
      label:'规则已就绪'
    };
  }

  const labels={
    NOT_MATURED:'尚未满72h',
    ACQUISITION_INCOMPLETE:'已满72h，等待数据完整性确认',
    ACQUISITION_STALE:'等待采集状态恢复',
    ACTIVITY_ARTIFACT_STALE:'等待活动数据刷新',
    NO_COMPLETE_MEMBERSHIP_SNAPSHOT:'等待首次完整成员快照',
    MEMBERSHIP_SNAPSHOT_STALE:'等待成员快照刷新',
    WAITING_FOR_COMPLETE_MEMBERSHIP_SNAPSHOT:'等待成熟后完整成员快照'
  };

  return {
    cls:
      status==='NOT_MATURED'
        ? 'gate-wait'
        : 'gate-blocked',

    label:
      labels[status]||
      status
  };
}

function reasonTags(m){
  const reasons=
    Array.isArray(m?.reasons)
      ? m.reasons
      : [];

  const out=[];

  if(
    reasons.includes(
      'INACTIVE_72H'
    )
  ){
    out.push(
      '<span class="reason-tag reason-inactive">72h 无活动</span>'
    );
  }

  if(
    reasons.includes(
      'DUAL_MEMBERSHIP_HJS_SOLO'
    )
  ){
    out.push(
      '<span class="reason-tag reason-dual">加入贺嘉述专组</span>'
    );
  }

  return out.join('');
}

function observedOrderLabel(v){
  const labels={
    HJS_AFTER_NEW_GROUP:
      '系统首次观察：先新组，后贺嘉述专组',

    HJS_BEFORE_NEW_GROUP:
      '系统首次观察：先贺嘉述专组，后新组',

    SAME_FIRST_OBSERVATION:
      '系统首次观察：两组时间相同'
  };

  return labels[v]||'';
}

function reviewMember(m){
  const details=
    m?.reason_details&&
    typeof m.reason_details==='object'
      ? m.reason_details
      : {};

  const inactive=
    details.INACTIVE_72H||null;

  const dual=
    details.DUAL_MEMBERSHIP_HJS_SOLO||null;

  const meta=[];

  if(inactive){
    if(inactive.latest_activity_at){
      meta.push(
        `最近活动：${esc(fmt(inactive.latest_activity_at))}`
      );
    }

    if(inactive.activity_window_start){
      meta.push(
        `72h 窗口起点：${esc(fmt(inactive.activity_window_start))}`
      );
    }

    if(inactive.verified_current_at){
      meta.push(
        `成员状态确认：${esc(fmt(inactive.verified_current_at))}`
      );
    }
  }

  if(dual){
    if(dual.new_group_first_seen_at){
      meta.push(
        `新组首次发现：${esc(fmt(dual.new_group_first_seen_at))}`
      );
    }

    if(dual.hjs_group_first_seen_at){
      meta.push(
        `贺嘉述专组首次发现：${esc(fmt(dual.hjs_group_first_seen_at))}`
      );
    }

    const order=observedOrderLabel(
      dual.observed_join_order
    );

    if(order){
      meta.push(
        esc(order)
      );
    }
  }

  const link=m.profile_url
    ? `<a href="${esc(m.profile_url)}" target="_blank" rel="noopener noreferrer">打开豆瓣主页 ↗</a>`
    : '';

  return `
    <article class="review-member">
      <div class="review-member-head">
        <div>
          <div class="name">
            ${esc(m.display_name||'未记录昵称')}
          </div>
          <div class="key">
            profile_key: ${esc(m.profile_key||'—')}
          </div>
        </div>

        <div>${link}</div>
      </div>

      <div class="reason-row">
        ${reasonTags(m)}
      </div>

      ${
        meta.length
          ? `
            <div class="review-member-meta">
              ${meta.map(x=>`<div>${x}</div>`).join('')}
            </div>
          `
          : ''
      }
    </article>
  `;
}

function matchesReviewFilter(m){
  const reasons=
    Array.isArray(m?.reasons)
      ? m.reasons
      : [];

  const inactive=
    reasons.includes(
      'INACTIVE_72H'
    );

  const dual=
    reasons.includes(
      'DUAL_MEMBERSHIP_HJS_SOLO'
    );

  if(currentReviewFilter==='inactive')
    return inactive;

  if(currentReviewFilter==='dual')
    return dual;

  if(currentReviewFilter==='both')
    return inactive&&dual;

  return true;
}

function renderReviewMembers(){
  const all=
    Array.isArray(
      currentReview?.members
    )
      ? currentReview.members
      : [];

  const gates=
    currentReview?.rule_gates||{};

  const inactiveReady=
    !!gates.INACTIVE_72H?.ready;

  const dualReady=
    !!gates.DUAL_MEMBERSHIP_HJS_SOLO?.ready;

  const allRulesReady=
    inactiveReady&&dualReady;

  const rows=
    all.filter(
      matchesReviewFilter
    );

  if(!rows.length){
    $('reviewResults').innerHTML=
      `<div class="panel empty">${
        all.length
          ? '当前筛选条件下没有待复核成员。'
          : allRulesReady
            ? '当前没有待复核成员。'
            : '当前暂无已确认待复核成员；仍有规则尚未就绪。'
      }</div>`;

    return;
  }

  $('reviewResults').innerHTML=
    rows.map(reviewMember).join('');
}

function renderReview(review){
  currentReview=review;
  currentReviewFilter='all';

  const summary=
    review?.summary||{};

  const gates=
    review?.rule_gates||{};

  const inactiveReady=
    !!gates.INACTIVE_72H?.ready;

  const dualReady=
    !!gates.DUAL_MEMBERSHIP_HJS_SOLO?.ready;

  const allRulesReady=
    inactiveReady&&dualReady;

  const anyRuleReady=
    inactiveReady||dualReady;

  const confirmedTotal=
    Number(
      summary.review_members||0
    );

  const inactiveCount=
    inactiveReady
      ? Number(
          summary.inactive_72h||0
        )
      : '暂不可判定';

  const dualCount=
    dualReady
      ? Number(
          summary.dual_membership_hjs_solo||0
        )
      : '暂不可判定';

  const bothCount=
    allRulesReady
      ? Number(
          summary.both_reasons||0
        )
      : '暂不可判定';

  const totalDisplay=
    allRulesReady
      ? String(confirmedTotal)
      : anyRuleReady
        ? `已确认 ${confirmedTotal}`
        : '暂不可判定';

  const totalLabel=
    allRulesReady
      ? '待复核总数'
      : '当前已确认待复核';

  $('reviewState').textContent=
    `待剔除索引：${fmt(review?.generated_at)}`;

  $('reviewSummary').innerHTML=`
    <div class="review-grid">
      <div class="stat-card">
        <div class="stat-value">
          ${esc(totalDisplay)}
        </div>
        <div class="stat-label">${esc(totalLabel)}</div>
      </div>

      <div class="stat-card">
        <div class="stat-value">
          ${esc(inactiveCount)}
        </div>
        <div class="stat-label">72h 无活动</div>
      </div>

      <div class="stat-card">
        <div class="stat-value">
          ${esc(dualCount)}
        </div>
        <div class="stat-label">加入贺嘉述专组</div>
      </div>

      <div class="stat-card">
        <div class="stat-value">
          ${esc(bothCount)}
        </div>
        <div class="stat-label">同时命中两项</div>
      </div>
    </div>

    <div class="review-notice">
      ${
        allRulesReady
          ? '全部复核规则均已完成数据确认。'
          : anyRuleReady
            ? '部分复核规则尚未就绪；当前人数仅包含已经能够确认的规则结果，不代表最终人数。'
            : '复核规则尚未完成数据确认，当前人数暂不可判定。'
      }
      此名单仅用于人工复核。
      系统不会自动移除成员，也不会把“暂时无活动”的成员直接视为待剔除对象。
    </div>
  `;

  const inactiveGate=
    gateMeta(
      gates.INACTIVE_72H
    );

  const dualGate=
    gateMeta(
      gates.DUAL_MEMBERSHIP_HJS_SOLO
    );

  $('reviewRules').innerHTML=`
    <div class="review-section-title">
      规则状态
    </div>

    <div class="rule-grid">
      <div class="rule-card">
        <div class="rule-top">
          <div class="rule-name">
            连续 72h 无活动
          </div>

          <span class="badge ${inactiveGate.cls}">
            ${esc(inactiveGate.label)}
          </span>
        </div>

        <div class="rule-desc">
          仅在成员连续 CURRENT 满 72 小时、
          数据采集完整且有成熟后的完整成员快照确认时参与复核。
        </div>
      </div>

      <div class="rule-card">
        <div class="rule-top">
          <div class="rule-name">
            新组 × 贺嘉述专组
          </div>

          <span class="badge ${dualGate.cls}">
            ${esc(dualGate.label)}
          </span>
        </div>

        <div class="rule-desc">
          当前同时属于新组和贺嘉述专组，
          且两边最新完整成员快照均已确认后进入复核。
        </div>
      </div>
    </div>
  `;

  const filters=[
    [
      'all',
      allRulesReady
        ? `全部 ${confirmedTotal}`
        : anyRuleReady
          ? `已确认 ${confirmedTotal}`
          : '全部 暂不可判定',
      true
    ],
    [
      'inactive',
      `72h 无活动 ${inactiveCount}`,
      inactiveReady
    ],
    [
      'dual',
      `贺嘉述专组 ${dualCount}`,
      dualReady
    ],
    [
      'both',
      `同时命中 ${bothCount}`,
      allRulesReady
    ]
  ];

  $('reviewFilters').innerHTML=`
    <div class="review-filters">
      ${filters.map(
        ([key,label,enabled])=>`
          <button
            type="button"
            class="review-filter ${
              key==='all'
                ? 'active'
                : ''
            }"
            data-review-filter="${key}"
            ${enabled?'':'disabled'}
          >
            ${esc(label)}
          </button>
        `
      ).join('')}
    </div>
  `;

  document
    .querySelectorAll(
      '.review-filter'
    )
    .forEach(btn=>{
      btn.addEventListener(
        'click',
        ()=>{
          currentReviewFilter=
            btn.dataset.reviewFilter||
            'all';

          document
            .querySelectorAll(
              '.review-filter'
            )
            .forEach(x=>
              x.classList.toggle(
                'active',
                x===btn
              )
            );

          renderReviewMembers();
        }
      );
    });

  renderReviewMembers();
}

async function loadReview(){
  const token=
    $('token').value;

  const state=
    $('reviewState');

  const button=
    $('refreshReview');

  $('reviewSummary').innerHTML='';
  $('reviewRules').innerHTML='';
  $('reviewFilters').innerHTML='';
  $('reviewResults').innerHTML='';

  if(!token){
    state.textContent=
      '请先输入内部访问口令';

    return;
  }

  button.disabled=true;
  state.textContent='加载中…';

  try{
    const r=await fetch(
      '/api/member-check',
      {
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        },
        body:JSON.stringify({
          token,
          mode:'review'
        })
      }
    );

    const d=await r.json();

    if(r.status===401){
      throw new Error(
        '口令不正确'
      );
    }

    if(
      r.status===503 &&
      d.error===
        'removal_review_not_ready'
    ){
      throw new Error(
        '待剔除复核数据尚未就绪'
      );
    }

    if(!r.ok){
      throw new Error(
        d.error||
        '加载失败'
      );
    }

    renderReview(
      d.review
    );

  }catch(e){
    state.textContent=
      e.message||
      '加载失败';

    $('reviewResults').innerHTML=
      '<div class="panel empty">无法加载待剔除复核数据。</div>';

  }finally{
    button.disabled=false;
  }
}

$('search').addEventListener('click',run);
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
$('tabSearch').addEventListener('click',()=>setTab('search'));
$('tabReview').addEventListener('click',()=>setTab('review'));
$('refreshReview').addEventListener('click',loadReview);
</script></body></html>
