<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>成员检索 · Fajia Online</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#29262c;--muted:#817980;--line:#eadfe2;--pink:#ff8aa1;--green:#237a4b;--greenbg:#edf8f1;--amber:#8a6100;--amberbg:#fff6d9;--red:#9e4051;--redbg:#fff0f2;--graybg:#f5f3f4;--blue:#3568a8;--bluebg:#eef5ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:980px;margin:auto;padding:42px 18px 72px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
h1{font-size:34px;line-height:1.2;margin:8px 0}.lead{margin:0;color:var(--muted)}
.panel,.result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
.row{display:grid;grid-template-columns:1fr;gap:12px}
label{font-weight:650;display:block;margin-bottom:6px}
input{width:100%;font:inherit;border:1px solid #ddd2d6;border-radius:12px;padding:12px 14px;outline:none}
input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,138,161,.13)}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--text);color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.45}
.hint,.state{color:var(--muted);font-size:13px}.state{margin-left:10px}
.actions{display:flex;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.result-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.name{font-size:19px;font-weight:760}
.key{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);word-break:break-all}
.group-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.group-card{border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.group-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.group-name{font-weight:700}
.badge{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.current{background:var(--greenbg);color:var(--green)}
.missing{background:var(--amberbg);color:var(--amber)}
.exited{background:var(--redbg);color:var(--red)}
.never{background:var(--graybg);color:var(--muted)}
.history{margin-top:8px;color:var(--muted);font-size:12px;display:grid;gap:2px}
.warning{background:#fff8e8;border:1px solid #f1dfad;border-radius:14px;padding:12px 14px;margin-top:14px}
.empty{padding:26px;text-align:center;color:var(--muted)}
a{color:inherit}
.activity{margin-top:16px;border-top:1px dashed var(--line);padding-top:15px}
.activity-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.activity-title{font-weight:760;font-size:15px}
.activity-meta{color:var(--muted);font-size:12px}
.activity-list{display:grid;gap:9px;margin-top:10px}
.activity-item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.activity-row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.activity-time{font-size:12px;color:var(--muted)}
.activity-source{font-size:12px;color:var(--blue);background:var(--bluebg);padding:2px 7px;border-radius:999px;white-space:nowrap}
.activity-text{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.activity-link{margin-top:5px;font-size:12px;color:var(--muted)}
.more{margin-top:9px;background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 11px;font-size:12px}
.noactivity{margin-top:10px;color:var(--muted);font-size:13px}
@media(min-width:720px){.row{grid-template-columns:260px 1fr}.group-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">FAJIA · INTERNAL TOOL</div>
<h1>豆瓣成员检索</h1>
<p class="lead">查询成员状态，并查看旧组已收录的最近发言。</p>

<section class="panel">
  <div class="row">
    <div>
      <label for="token">内部访问口令</label>
      <input id="token" type="password" autocomplete="off" placeholder="MEMBER_CHECK_TOKEN">
      <div class="hint">只随本次请求发送。</div>
    </div>
    <div>
      <label for="query">成员</label>
      <input id="query" type="search" autocomplete="off" placeholder="昵称 / username / 豆瓣个人主页 URL">
      <div class="hint">昵称可能重名；个人主页 URL / profile key 最可靠。</div>
    </div>
  </div>
  <div class="actions"><button id="search">搜索</button><span class="state" id="state"></span></div>
</section>

<section id="summary"></section>
<section id="results"></section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let trackedGroups=[];

function fmt(v){
  if(!v)return '—';
  try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}
  catch{return String(v)}
}

function meta(s){
  if(!s)return{c:'never',l:'未发现成员记录',i:'—'};
  if(s.status==='CURRENT')return{c:'current',l:Number(s.rejoined_count||0)>0?`当前成员 · 曾重新加入 ${Number(s.rejoined_count)} 次`:'当前成员',i:'✓'};
  if(s.status==='MISSING')return{c:'missing',l:'待确认是否退出',i:'?'};
  if(s.status==='EXITED')return{c:'exited',l:'已退出',i:'○'};
  return{c:'never',l:'状态未知',i:'—'};
}

function hist(s){
  if(!s)return '<div class="history"><div>当前数据库中没有该组成员记录。</div></div>';
  const a=[];
  if(s.first_seen_at)a.push(`<div>首次发现：${esc(fmt(s.first_seen_at))}</div>`);
  if(s.last_seen_at)a.push(`<div>最后确认在组：${esc(fmt(s.last_seen_at))}</div>`);
  if(s.missing_since)a.push(`<div>首次检测缺失：${esc(fmt(s.missing_since))}</div>`);
  if(s.exit_confirmed_at)a.push(`<div>确认退出：${esc(fmt(s.exit_confirmed_at))}</div>`);
  if(Number(s.rejoined_count||0)>0)a.push(`<div>重新加入记录：${Number(s.rejoined_count)} 次</div>`);
  return `<div class="history">${a.join('')||'<div>已有成员记录，时间信息尚未提供。</div>'}</div>`;
}

function card(g,m){
  const s=m.memberships?.[String(g.id)]||null,x=meta(s);
  return `<div class="group-card"><div class="group-top"><div class="group-name">${esc(g.name)}</div><span class="badge ${x.c}">${x.i} ${esc(x.l)}</span></div>${hist(s)}</div>`;
}

function activityItem(x){
  const kind=x.source_type==='reply'?'回复':'发言';
  const src=x.source_label||x.source_key||'豆瓣闲聊楼';
  const link=x.source_url?`<div class="activity-link"><a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">查看原发言 ↗</a></div>`:'';
  return `<div class="activity-item"><div class="activity-row"><div class="activity-time">${esc(fmt(x.published_at))}</div><div class="activity-source">${esc(src)} · ${esc(kind)}</div></div><div class="activity-text">${esc(x.text||'')}</div>${link}</div>`;
}

function activityBlock(m){
  const a=m.activity;
  if(!a||!Number(a.total_count||0)){
    return `<div class="activity"><div class="activity-head"><div class="activity-title">旧组最近发言</div></div><div class="noactivity">当前已回填的数据中没有匹配到该账号的发言。</div></div>`;
  }
  const items=Array.isArray(a.recent)?a.recent:[];
  const first=items.slice(0,5),rest=items.slice(5);
  const id='act_'+String(m.profile_key||'').replace(/[^a-zA-Z0-9_-]/g,'_');
  return `<div class="activity">
    <div class="activity-head"><div>
      <div class="activity-title">法述进修学院（旧组）· 最近发言</div>
      <div class="activity-meta">已收录 ${Number(a.total_count)} 条${a.latest_at?` · 最近一条 ${esc(fmt(a.latest_at))}`:''}</div>
    </div></div>
    <div class="activity-list">
      ${first.map(activityItem).join('')}
      <div id="${id}" style="display:none">${rest.map(activityItem).join('')}</div>
    </div>
    ${rest.length?`<button class="more" type="button" data-target="${id}" data-count="${rest.length}">查看更多（再显示 ${rest.length} 条）</button>`:''}
  </div>`;
}

function render(m){
  const link=m.profile_url?`<a href="${esc(m.profile_url)}" target="_blank" rel="noopener noreferrer">打开豆瓣主页 ↗</a>`:'';
  return `<article class="result">
    <div class="result-head">
      <div><div class="name">${esc(m.display_name||'未命名')}</div><div class="key">profile_key: ${esc(m.profile_key||'—')}</div></div>
      <div>${link}</div>
    </div>
    <div class="group-grid">${trackedGroups.map(g=>card(g,m)).join('')}</div>
    ${activityBlock(m)}
  </article>`;
}

async function run(){
  const token=$('token').value,query=$('query').value.trim(),st=$('state'),res=$('results'),sum=$('summary');
  res.innerHTML='';sum.innerHTML='';
  if(!token){st.textContent='请先输入内部访问口令';return}
  if(!query){st.textContent='请输入昵称或主页 URL';return}

  $('search').disabled=true;st.textContent='查询中…';
  try{
    const r=await fetch('/api/member-check',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,query})
    });
    const d=await r.json();

    if(r.status===401)throw new Error('口令不正确');
    if(!r.ok)throw new Error(d.error||'查询失败');

    trackedGroups=Array.isArray(d.tracked_groups)?d.tracked_groups:[];
    st.textContent=`成员索引：${fmt(d.generated_at)}${d.activity_generated_at?` · 发言索引：${fmt(d.activity_generated_at)}`:''}`;

    if(!d.matches?.length){
      res.innerHTML='<div class="panel empty">当前数据库中没有找到匹配账号。</div>';
      return;
    }
    if(d.total_matches>1){
      sum.innerHTML=`<div class="warning">找到 ${d.total_matches} 个候选。昵称可能重名，请结合 profile key / 个人主页确认身份。</div>`;
    }

    res.innerHTML=d.matches.map(render).join('');
    document.querySelectorAll('.more').forEach(btn=>btn.addEventListener('click',()=>{
      const el=document.getElementById(btn.dataset.target);
      if(!el)return;
      const open=el.style.display!=='none';
      el.style.display=open?'none':'contents';
      btn.textContent=open?`查看更多（再显示 ${btn.dataset.count} 条）`:'收起更多发言';
    }));
  }catch(e){
    st.textContent=e.message||'查询失败';
  }finally{
    $('search').disabled=false;
  }
}

$('search').addEventListener('click',run);
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body>
</html>
